[project]
name = "atlasopt"
version = "0.1.0"
description = "Atlas Tree point-allocation optimizer — Python reference implementation"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3",
    "highspy>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlasopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
