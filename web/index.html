<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas Optimizer</title>
  </head>
  <body>
    <div id="app">
      <canvas id="tree"></canvas>
      <aside id="panel">
        <h1>Atlas Optimizer</h1>
        <div id="points"><span id="points-used">0</span> / <span id="points-total">138</span></div>
        <div id="status" class="status idle">Click nodes to select targets</div>
        <div id="ignored-wrap" hidden>
          <h2>Ignored selections (unreachable)</h2>
          <ul id="ignored"></ul>
        </div>
        <div class="buttons">
          <button id="export" disabled>Open in PoE Planner</button>
          <button id="reset">Reset</button>
        </div>
        <div id="hint">
          Click: select → exclude → clear<br />
          Mastery click: toggle all Notables of that mastery<br />
          Drag: pan / Wheel: zoom
        </div>
        <div id="toast" hidden></div>
      </aside>
    </div>
    <div id="tooltip" hidden></div>
    <div id="loading">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
